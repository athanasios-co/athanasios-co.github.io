<!-- Clients: glass tiles (data: _data/clients.yml) -->
<section class="client-tiles measure" aria-labelledby="client-tiles-title">
  <h3 id="client-tiles-title">Clients</h3>
  <ul class="client-grid">
    {%- for c in site.data.clients %}
    {%- assign meta = c.tag | default: '' -%}
    <li>
      {%- if c.url != '#' %}
      <a class="client-tile" href="{{ c.url }}"{% if c.aria %} aria-label="{{ c.aria }}"{% endif %} target="_blank" rel="noopener">
        <span class="client-tile__name">{{ c.name }}</span>
        <span class="client-tile__meta" aria-hidden="true">{% if meta != '' %}{{ meta }} {% endif %}↗</span>
      </a>
      {%- else %}
      <div class="client-tile is-static">
        <span class="client-tile__name">{{ c.name }}</span>
        {%- if meta != '' %}<span class="client-tile__meta">{{ meta }}</span>{% endif %}
      </div>
      {%- endif %}
    </li>
    {%- endfor %}
  </ul>
</section>
