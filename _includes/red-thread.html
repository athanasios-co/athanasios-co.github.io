<!-- Red thread: straight vertical line from the "Let's talk strategy" button down to the clients section.
     Positioned by a few lines of JS so it follows the page at any screen size. -->
<div class="red-thread" aria-hidden="true"></div>
<div class="red-thread-ink" aria-hidden="true"></div>
<script>
(function () {
  var line = document.querySelector('.red-thread');
  var start = document.querySelector('[data-thread-start]');
  var band = document.querySelector('.client-band');
  var ink = document.querySelector('.red-thread-ink');
  if (!line || !start || !band) return;
  function place() {
    var r = start.getBoundingClientRect(), b = band.getBoundingClientRect();
    var sx = window.scrollX || 0, sy = window.scrollY || 0;
    var x = r.left + r.width / 2 + sx, top = r.bottom + sy, bottom = b.top + sy + 2;
    line.style.left = x + 'px';
    line.style.top = top + 'px';
    line.style.height = Math.max(0, bottom - top) + 'px';
    if (ink) { ink.style.left = x + 'px'; ink.style.top = (b.top + sy) + 'px'; }
  }
  place();
  window.addEventListener('load', place);
  window.addEventListener('resize', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  if ('ResizeObserver' in window) new ResizeObserver(place).observe(document.body);
})();
</script>
